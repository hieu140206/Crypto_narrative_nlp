# Nguồn duy nhất cho mọi mốc thời gian. Đổi ở đây, không đổi trong code.
sample:
  start: "2021-03-01"          # Cointelegraph/Decrypt đủ nguồn từ 3/2021
  t_end: "2025-06-30"          # Cointelegraph kết thúc 30/6/2025
  robustness_start: "2020-01-01"
  market_end: "2025-12-31"     # lịch Binance daily (đổi thành 2026-.. khi thêm holdout)
split:
  train: ["2021-03-01", "2022-12-31"]
  validation: ["2023-01-01", "2023-12-31"]
  test: ["2024-01-01", "2025-06-30"]
  embargo_days: 7
horizons: [1, 3, 7]
abn_attention_window: 30
seed: 42
own_n_min: 5                           # sentiment riêng asset: N < ngưỡng → NaN + own_low_n
exclude_sources_main: ["cryptonews"]   # vào 2023-06, có ngày dump 26/6 và 23/10/2023
dump_max_per_source_day: 300           # ngưỡng bài/nguồn/ngày để coi là dump
min_title_chars: 20
junk_titles: ["x icon", "error 500", "page not found", "just a moment"]

# Họ 5 — học máy (lưới cố định trước khi chạy; không mở rộng sau)
ml:
  target: "y_logrv_h"                 # y_logrv_{h}, h ∈ horizons
  assets: ["BTC", "ETH"]
  features_market:
    - har_d
    - har_w
    - har_m
    - ret_t
    - logvol_t
    - dow_Tue
    - dow_Wed
    - dow_Thu
    - dow_Fri
    - dow_Sat
    - dow_Sun
    - fred_VIXCLS
    - fred_VIXCLS_d5
    - fred_DGS10
    - fred_DGS10_d5
    - fred_DTWEXBGS
    - fred_DTWEXBGS_d5
  features_text:
    - all_finbert_Sent_t
    - all_finbert_PosSent
    - all_finbert_NegSent
    - all_finbert_MeanProb_t
    - all_vader_Sent_t
    - all_finbert_AbnAttention_t
    - AbnAtt_regulation
    - AbnAtt_etf
    - AbnAtt_institutional_adoption
    - AbnAtt_hacks_security
    - AbnAtt_defi
    - AbnAtt_stablecoins
    - AbnAtt_monetary_policy
  elastic_net:
    alpha: [0.0001, 0.001, 0.01, 0.1]
    l1_ratio: [0.1, 0.5, 0.9]
  xgboost:
    backend: xgboost                  # xgboost đã cài; không dùng lightgbm
    max_depth: [2, 3]
    n_estimators: [200, 400]
    learning_rate: [0.03, 0.05]
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    reg_lambda: 1.0
    tree_method: hist
    n_jobs: 1
    random_state: 42
  cv:
    n_folds: 5
    # embargo_days lấy từ split.embargo_days
  refit:
    elastic_net_every_days: 1         # refit mỗi ngày gốc
    xgboost_every_days: 20            # refit mỗi 20 ngày gốc

# Họ 5 — lưới v2 (mở rộng biên sau validation v1; sai khác công bố)
# features/cv/refit giống ml:; chỉ nới elastic_net + xgboost
ml_v2:
  target: "y_logrv_h"
  assets: ["BTC", "ETH"]
  features_market:
    - har_d
    - har_w
    - har_m
    - ret_t
    - logvol_t
    - dow_Tue
    - dow_Wed
    - dow_Thu
    - dow_Fri
    - dow_Sat
    - dow_Sun
    - fred_VIXCLS
    - fred_VIXCLS_d5
    - fred_DGS10
    - fred_DGS10_d5
    - fred_DTWEXBGS
    - fred_DTWEXBGS_d5
  features_text:
    - all_finbert_Sent_t
    - all_finbert_PosSent
    - all_finbert_NegSent
    - all_finbert_MeanProb_t
    - all_vader_Sent_t
    - all_finbert_AbnAttention_t
    - AbnAtt_regulation
    - AbnAtt_etf
    - AbnAtt_institutional_adoption
    - AbnAtt_hacks_security
    - AbnAtt_defi
    - AbnAtt_stablecoins
    - AbnAtt_monetary_policy
  elastic_net:
    alpha: [0.0001, 0.001, 0.01, 0.1, 0.3, 1.0, 3.0]
    l1_ratio: [0.1, 0.5, 0.9]
  xgboost:
    backend: xgboost
    max_depth: [1, 2, 3]
    n_estimators: [100, 200, 400]
    learning_rate: [0.01, 0.03, 0.05]
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: [5, 20]
    reg_lambda: 1.0
    tree_method: hist
    n_jobs: 1
    random_state: 42
  cv:
    n_folds: 5
  refit:
    elastic_net_every_days: 1
    xgboost_every_days: 20
